id = "traex"
version = "2026.09.30.1"
min_engine_version = 1
updated_at = "2026-09-30T00:00:00Z"
aliases = ["traecli"]

# Captured from TRAE CLI Next v0.200.19 before it opens an untrusted project.
[[rules]]
id = "directory_trust_prompt"
state = "blocked"
priority = 1000
region = "whole_recent"
visible_blocker = true
contains = [
  "Do you trust the contents of this directory?",
  "Yes, continue",
  "No, quit",
  "Press enter to continue",
]

# Captured from the installed `traecli` compatibility executable (v0.120.47).
[[rules]]
id = "alias_migration_prompt"
state = "blocked"
priority = 950
region = "whole_recent"
visible_blocker = true
contains = [
  "TRAE CLI Next is installed.",
  "Do you want to point Coco command aliases",
  "CLI Next?",
  "Switch aliases",
  "Keep Coco",
]

# TRAE CLI Next prefixes its OSC title with a braille spinner while working.
# TraeCode CLI keeps that signal, but its static title is not an idle signal.
[[rules]]
id = "osc_spinner_working"
state = "working"
priority = 900
region = "osc_title"
visible_working = true
regex = ['(?:^| )[⠋⠙⠹⠸⠼⠴⠦⠧⠇⠏](?: |$)']

# Captured TraeCode CLI approval and request_user_input controls. Restrict to
# the live panel below the last border so transcript copies do not block idle.
[[rules]]
id = "command_approval"
state = "blocked"
priority = 980
region = "after_last_horizontal_rule"
visible_blocker = true
contains = ["Yes, proceed"]
regex = ['Would\s+you\s+like\s+to\s+run\s+the\s+following\s+command\?', 'enter confirm\s*\|\s*esc cancel\s*\z']

[[rules]]
id = "question_input"
state = "blocked"
priority = 975
region = "after_last_horizontal_rule"
visible_blocker = true
regex = ['Question \d+/\d+ \(\d+ unanswered\)', 'enter submit answer(?:\s*\|\s*|\s*\n\s*)esc interrupt\s*\z']

# New animation frames and tool execution use the same interrupt control.
# Only the current line above the composer is authoritative; old transcript
# text, including earlier Working lines, must not keep a completed turn busy.
[[rules]]
id = "composer_interrupt_working"
state = "working"
priority = 875
region = "above_prompt_box"
visible_working = true
regex = ['(?:^|\n)[◈◇❖✦◆✧] (?:Working|Running command)…\s+\([^)]*esc to\s+interrupt\)(?:\s*·\s*(?:\d+ shell running…|/ps to\s+manage))*(?:\s+└ Tip:[^\n]*(?:\n[^\n◆■▍❯─]*)*)?\s*\z']

# A future activity label with the interrupt control is uncertain, never idle.
[[rules]]
id = "unrecognized_interrupt_control"
state = "unknown"
priority = 870
region = "above_prompt_box"
regex = ['(?:^|\n)[^\n]*\([^)]*esc to\s+interrupt\)(?:[^\n]*(?:\n[^\n◆■▍❯─]*)*)?\s*\z']

# TraeCode CLI's loaded composer replaced the permission-cycle footer with a
# context meter. Narrow panes truncate either the context suffix or the
# permission hint; accept the captured combined suffix while still requiring
# the complete bordered composer at the live tail. Busy controls and input
# panels above have precedence. Multiline user input is allowed.
[[rules]]
id = "context_composer_idle"
state = "idle"
priority = 860
region = "bottom_non_empty_lines(12)"
visible_idle = true
regex = ['(?m)^─{3,}[^\n]*\n❯(?: [^\n]*)?(?:\n[^\n]*)*\n─{3,}[^\n]*\n +[^\n]+ · Context \d{1,3}%(?: left[^\n]*|\s*…\s+▧ Workspace Edit)\s*\z']

# The visible fallback remains useful if a terminal strips OSC titles.
[[rules]]
id = "working_interrupt_hint"
state = "working"
priority = 850
region = "whole_recent"
visible_working = true
line_regex = ['^[◈◇] Working… \([^)]*esc to interrupt\)(?: · .*)?$']

# The composer footer is the captured idle surface. Working screens keep the
# composer visible, so working controls must retain precedence.
[[rules]]
id = "full_access_composer_idle"
state = "idle"
priority = 500
region = "bottom_non_empty_lines(3)"
visible_idle = true
line_regex = [
  '^❯ ',
  '^.*(?:▰ Full Access|◐ Workspace Edit) \(shift\+tab to cycle\)$',
]

# Known agents normally inherit a generic idle fallback. Traex stays unknown
# unless one of the captured states above matches.
[[rules]]
id = "unobserved_screen_unknown"
state = "unknown"
priority = 1
region = "whole_recent"
regex = ['(?s).*']
