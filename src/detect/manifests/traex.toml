id = "traex"
version = "2026.10.04.3"
min_engine_version = 1
updated_at = "2026-10-04T00:00:00Z"
aliases = ["traecli"]

# Captured from TRAE CLI Next v0.200.19 before it opens an untrusted project.
[[rules]]
id = "directory_trust_prompt"
state = "blocked"
priority = 1000
region = "whole_recent"
visible_blocker = true
contains = [
  "Do you trust the contents of this directory?",
  "Yes, continue",
  "No, quit",
]
regex = ['(?:Press enter to continue|enter continue\s*\|\s*esc quit)']

# Captured from the installed `traecli` compatibility executable (v0.120.47).
[[rules]]
id = "alias_migration_prompt"
state = "blocked"
priority = 950
region = "whole_recent"
visible_blocker = true
contains = [
  "TRAE CLI Next is installed.",
  "Do you want to point Coco command aliases",
  "CLI Next?",
  "Switch aliases",
  "Keep Coco",
]

# TRAE CLI Next prefixes its OSC title with a braille spinner while working.
# TraeCode CLI keeps that signal, but its static title is not an idle signal.
[[rules]]
id = "osc_spinner_working"
state = "working"
priority = 900
region = "osc_title"
visible_working = true
regex = ['(?:^| )[⠋⠙⠹⠸⠼⠴⠦⠧⠇⠏](?: |$)']

# Captured TraeCode CLI approval and request_user_input controls. Restrict to
# the live panel below the last border so transcript copies do not block idle.
[[rules]]
id = "command_approval"
state = "blocked"
priority = 980
region = "after_last_horizontal_rule"
visible_blocker = true
contains = ["Yes, proceed"]
regex = ['Would\s+you\s+like\s+to\s+run\s+the\s+following\s+command\?', 'enter confirm\s*\|\s*esc cancel(?:\s*\n❯[^\n]*(?:\n[^\n]*)*)?\s*\z']

[[rules]]
id = "question_input"
state = "blocked"
priority = 975
region = "after_last_horizontal_rule"
visible_blocker = true
regex = ['Question \d+/\d+ \(\d+ unanswered\)', 'enter submit answer(?:\s*\|\s*|\s*\n\s*)esc interrupt(?:\s*\n❯[^\n]*(?:\n[^\n]*)*)?\s*\z']

# New animation frames, translated labels, and tool execution use the same
# interrupt control. Only that current control immediately above the composer
# is authoritative; status wording is incidental and old transcript text must
# not keep a completed turn busy.
[[rules]]
id = "current_interrupt_working"
state = "working"
priority = 870
region = "above_prompt_box"
visible_working = true
regex = ['(?:^|\n)[\p{P}\p{S}][ \t]+[\p{L}\p{N}][^\n]*(?:\n[ \t]+[^\n◆■▍❯─]*)*\([^)]*esc\s+to\s+interrupt\)[^\n]*(?:\n(?:[ \t]+|·[ \t]+)[^\n◆■▍❯─]*)*(?:\s*\n❯[^\n]*(?:\n[^\n]*)*)?\s*\z']

# An unavailable observation is not evidence that the activity bar is absent.
[[rules]]
id = "unavailable_screen_unknown"
state = "unknown"
priority = 20
region = "whole_recent"
regex = ['(?s)^\s*$']

# Once a live TraeX process has a non-empty current screen, the absence of a
# higher-priority activity or user-input control is the ordinary idle signal.
# Composer chrome and the fixed model/path/permission footer are incidental.
[[rules]]
id = "observed_screen_idle"
state = "idle"
priority = 10
region = "whole_recent"
visible_idle = true
regex = ['(?s)\S']
