id = "traex"
version = "2026.09.30.1"
min_engine_version = 1
updated_at = "2026-09-30T00:00:00Z"
aliases = ["traecli"]

# Captured from TRAE CLI Next v0.200.19 before it opens an untrusted project.
[[rules]]
id = "directory_trust_prompt"
state = "blocked"
priority = 1000
region = "whole_recent"
visible_blocker = true
contains = [
  "Do you trust the contents of this directory?",
  "Yes, continue",
  "No, quit",
]
regex = ['(?:Press enter to continue|enter continue\s*\|\s*esc quit)']

# Captured from the installed `traecli` compatibility executable (v0.120.47).
[[rules]]
id = "alias_migration_prompt"
state = "blocked"
priority = 950
region = "whole_recent"
visible_blocker = true
contains = [
  "TRAE CLI Next is installed.",
  "Do you want to point Coco command aliases",
  "CLI Next?",
  "Switch aliases",
  "Keep Coco",
]

# TRAE CLI Next prefixes its OSC title with a braille spinner while working.
# TraeCode CLI keeps that signal, but its static title is not an idle signal.
[[rules]]
id = "osc_spinner_working"
state = "working"
priority = 900
region = "osc_title"
visible_working = true
regex = ['(?:^| )[⠋⠙⠹⠸⠼⠴⠦⠧⠇⠏](?: |$)']

# Captured TraeCode CLI approval and request_user_input controls. Restrict to
# the live panel below the last border so transcript copies do not block idle.
[[rules]]
id = "command_approval"
state = "blocked"
priority = 980
region = "after_last_horizontal_rule"
visible_blocker = true
contains = ["Yes, proceed"]
regex = ['Would\s+you\s+like\s+to\s+run\s+the\s+following\s+command\?', 'enter confirm\s*\|\s*esc cancel(?:\s*\n❯ Use /skills to list available skills\n▀{3,})?\s*\z']

[[rules]]
id = "question_input"
state = "blocked"
priority = 975
region = "after_last_horizontal_rule"
visible_blocker = true
regex = ['Question \d+/\d+ \(\d+ unanswered\)', 'enter submit answer(?:\s*\|\s*|\s*\n\s*)esc interrupt(?:\s*\n❯ Use /skills to list available skills\n▀{3,})?\s*\z']

# New animation frames and tool execution use the same interrupt control.
# Only the current activity area immediately above the composer is
# authoritative; old transcript text must not keep a completed turn busy.
[[rules]]
id = "composer_interrupt_working"
state = "working"
priority = 875
region = "above_prompt_box"
visible_working = true
regex = ['(?:^|\n)[◈◇❖✦◆✧] (?:(?:Working|Running command)…|Waiting for command…?)\s+\([^)]*esc to\s+interrupt\)(?:\s*·\s*(?:\d+ shell running…|/ps to\s+manage))*(?:\s+└ Tip:[^\n]*(?:\n[^\n◆■▍❯─]*)*)?(?:\s*\n❯[^\n]*\n▀{3,})?\s*\z']

# A current interrupt control is activity even when its label is new.
[[rules]]
id = "current_interrupt_working"
state = "working"
priority = 870
region = "above_prompt_box"
visible_working = true
regex = ['(?:^|\n)[^\n]*\([^)]*esc to\s+interrupt\)(?:[^\n]*(?:\n[^\n◆■▍❯─]*)*)?(?:\s*\n❯[^\n]*\n▀{3,})?\s*\z']

# A complete bordered composer at the live tail is the idle authority after
# current activity and user-action waits have been ruled out. Footer content,
# model names, context meters, permissions, pane width and multiline input are
# deliberately incidental. Indented footer rows are allowed; a shell prompt or
# other unowned tail is not.
[[rules]]
id = "current_composer_idle"
state = "idle"
priority = 860
region = "bottom_non_empty_lines(12)"
visible_idle = true
regex = ['(?m)^─{3,}[^\n]*\n❯[^\n]*(?:\n[^\n─][^\n]*)*\n─{3,}[^\n]*(?:\n {2,}[^\n]*)*\s*\z']

# Captured from a loaded TraeCode CLI 0.207.1 pane at 219 columns. This
# alternate composer has no footer. The prompt contents are incidental; the
# half-block tail owns the current composer boundary. Active controls and input
# panels above retain precedence.
[[rules]]
id = "halfblock_composer_idle"
state = "idle"
priority = 858
region = "bottom_non_empty_lines(12)"
visible_idle = true
regex = ['(?m)^❯[^\n]*\n▀{3,}\s*\z']

# The visible fallback remains useful if a terminal strips OSC titles.
[[rules]]
id = "working_interrupt_hint"
state = "working"
priority = 850
region = "whole_recent"
visible_working = true
line_regex = ['^[◈◇] Working… \([^)]*esc to interrupt\)(?: · .*)?$']

# The composer footer is the captured idle surface. Working screens keep the
# composer visible, so working controls must retain precedence.
[[rules]]
id = "full_access_composer_idle"
state = "idle"
priority = 500
region = "bottom_non_empty_lines(3)"
visible_idle = true
line_regex = [
  '^❯ ',
  '^.*(?:▰ Full Access|◐ Workspace Edit) \(shift\+tab to cycle\)$',
]

# Known agents normally inherit a generic idle fallback. Traex stays unknown
# unless one of the captured states above matches.
[[rules]]
id = "unobserved_screen_unknown"
state = "unknown"
priority = 1
region = "whole_recent"
regex = ['(?s).*']
